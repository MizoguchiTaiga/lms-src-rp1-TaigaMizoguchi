<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>
	
	<!-- 溝口大河 – Task.27 ここから -->
	<!-- エラーメッセージ -->
	<th:block th:if="${not #strings.isEmpty(errorMessageList)}">
		<ul style="padding-left: 0; list-style: none;" th:each="errorMessage : ${errorMessageList}">
			<li><span th:text="'*' + '&nbsp' + ${errorMessage}" class="help-inline error"></span></li>
		</ul>
	</th:block>
	<!-- 溝口大河 – Task.27 ここまで -->

	<div class="row">
		<div class="bs-component col-sm-12">

			<!-- 溝口大河 – Task.27 -->
			<form th:action="@{/attendance/update}" method="post" onsubmit="return check()">
				<table class="table table-hover dataTable no-footer">
					<!-- 溝口大河 - Task.29 -->
					<thead style="display: block;">
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<!-- 溝口大河 - Task.29 -->
					<tbody style="display: block; overflow-y: scroll; height: 570px;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								<!-- 溝口大河 – Task.26 ここから -->
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingStartHour|" class="form-control">
										<option	th:each="trainingStartHour : ${attendanceForm.hourMap}" th:value="${trainingStartHour.value}" 
											th:inlne="text" class="form-control" th:selected="${trainingStartHour.key == dailyAttendanceForm.trainingStartHour}">
											[[${trainingStartHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingStartMinute|" class="form-control">
										<option	th:each="trainingStartMinute : ${attendanceForm.minuteMap}" th:value="${trainingStartMinute.value}" 
											th:inlne="text" class="form-control" th:selected="${trainingStartMinute.key == dailyAttendanceForm.trainingStartMinute}">
											[[${trainingStartMinute.value}]]</option>
									</select>
								</td>
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingEndHour|" class="form-control">
										<option	th:each="trainingEndHour : ${attendanceForm.HourMap}" th:value="${trainingEndHour.value}" 
											th:inlne="text" class="form-control" th:selected="${trainingEndHour.key == dailyAttendanceForm.trainingEndHour}">
											[[${trainingEndHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingEndMinute|" class="form-control">
										<option	th:each="trainingEndMinute : ${attendanceForm.minuteMap}" th:value="${trainingEndMinute.value}" 
											th:inlne="text" class="form-control" th:selected="${trainingEndMinute.key == dailyAttendanceForm.trainingEndMinute}">
											[[${trainingEndMinute.value}]]</option>
									</select>
								</td>
								<!-- 溝口大河 – Task.26 ここまで -->
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w140">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" />
				</div>
				<!-- 溝口大河 – Task.27 ここから -->
				<script>
					function check(){
 					 	if(window.confirm('更新します。よろしいですか？')){
							  return true;
						  } else {
							  return false;
						  }
						}
				</script>
				<!-- 溝口大河 – Task.27 ここまで -->
			</form>
		</div>
	</div>

</body>
</html>
